name: antt_sifama_boleto_2via-mcp
displayName: "ANTT SIFAMA: Segunda Via de Boletos"
description: >
  ANTT SIFAMA: Segunda Via de Boletos, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/antt_sifama_boleto_2via-mcp
repository: https://github.com/mcp-dir/antt_sifama_boleto_2via-mcp

tags:
  - antt_sifama_boleto_2via
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_antt_sifama_boleto_2via

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_antt_sifama_boleto_2via/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
